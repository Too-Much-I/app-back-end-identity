name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Validate role ARN
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::AWS_ROLE_ARN repository variable is empty or unavailable"
            exit 1
          fi

          case "$AWS_ROLE_ARN" in
            arn:aws:iam::*:role/*)
              echo "AWS_ROLE_ARN is configured"
              ;;
            *)
              echo "::error::AWS_ROLE_ARN is not a valid IAM role ARN"
              exit 1
              ;;
          esac

      - name: Print OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            )

            console.log(JSON.stringify({
              aud: payload.aud,
              sub: payload.sub,
              repository: payload.repository,
              ref: payload.ref,
              environment: payload.environment
            }, null, 2))

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: identity-oidc-test
          aws-region: ap-northeast-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity