plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'io.sentry.jvm.gradle' version '6.18.0'
}

group = 'web.tosunsaeng'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

def sentryAuthToken = System.getenv('SENTRY_AUTH_TOKEN')

sentry {
	// Source context는 build 인증 값이 주입된 CI에서만 외부로 업로드한다.
	includeSourceContext = sentryAuthToken != null && !sentryAuthToken.isBlank()
	org = 'tmi-99'
	projectName = 'to-teacher-identity'
	authToken = sentryAuthToken

	autoInstallation {
		sentryVersion.set('8.42.0')
	}
}

dependencies {
	// VPC Lattice workload 호출의 SigV4 서명과 ECS task role credential 해석
	implementation platform('software.amazon.awssdk:bom:2.29.52')
	implementation 'software.amazon.awssdk:auth'
	implementation 'software.amazon.awssdk:http-auth-aws'

	// REST API
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// 인증, 비밀번호 암호화, 인가
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Request DTO 검증
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Identity 전용 사용자 및 로그인 세션 DB
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

	// JWT 발급·서명·검증, JWK/JWKS 처리
	implementation 'org.springframework.security:spring-security-oauth2-jose'

	// Identity 자체의 /users/me 등 보호 API에서 JWT 검증
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// Firebase credential 검증은 내부 adapter 뒤에서만 사용한다.
	implementation 'com.google.firebase:firebase-admin:9.4.3'

	// Health Check
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Swagger / OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 테스트
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'de.bwaldvogel:mongo-java-server:1.47.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 실제 DB/Provider 없이 Controller에서 프론트 공유용 OpenAPI를 생성한다.
def openApiOutput = layout.buildDirectory.dir('generated/openapi')
tasks.register('exportOpenApi', Test) {
	group = 'documentation'
	description = 'Export the current Identity OpenAPI using the isolated test context.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter { includeTestsMatching 'web.tosunsaeng.identity.OpenApiSharingTests' }
	systemProperty 'identity.openapi.output-dir', openApiOutput.get().asFile.absolutePath
	outputs.dir(openApiOutput)
}

tasks.register('prepareSwaggerBundle', Sync) {
	group = 'documentation'
	dependsOn tasks.named('exportOpenApi')
	into layout.buildDirectory.dir('frontend-swagger')
	from(openApiOutput)
	from('docs/swagger')
	from({
		def swaggerJar = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
			it.moduleVersion.id.group == 'org.webjars' && it.name == 'swagger-ui'
		}.file
		zipTree(swaggerJar)
	}) {
		include '**/swagger-ui-bundle.js', '**/swagger-ui.css'
		eachFile { path = name }
		includeEmptyDirs = false
	}
}

tasks.register('shareSwagger', Zip) {
	group = 'documentation'
	description = 'Build a read-only offline Swagger UI and OpenAPI JSON ZIP for frontend handoff.'
	dependsOn tasks.named('prepareSwaggerBundle')
	from layout.buildDirectory.dir('frontend-swagger')
	archiveFileName = 'identity-swagger.zip'
	destinationDirectory = layout.buildDirectory.dir('distributions')
}
