spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/identity-test
      database: identity-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

app:
  consent:
    privacy-version: privacy-v1
    term-version: term-v1
    quality-review-version: quality-review-v1
  refresh-token:
    ttl: P14D
    random-bytes: 32
  jwt:
    issuer: https://identity.test
    audience: tosunsaeng-learning-core
    key-id: identity-test-rsa-key
    access-token-ttl: PT30M
    private-key-location: classpath:test-key-files-are-not-used.pem
    public-key-location: classpath:test-key-files-are-not-used.pem
    default-scopes:
      - learning:read
      - learning:write
  jwt-rotation:
    previous-key-ids: ""
    previous-public-key-locations: ""
  workload-jwt:
    enabled: false
    issuer: ""
    audience: learning-core-user-withdrawn
    subject: identity-service
    ttl: PT2M
  firebase-auth:
    enabled: false
    google-enabled: false
    apple-enabled: false
    kakao-enabled: false
    phone-enabled: false
  firebase-withdrawal-cleanup:
    enabled: false
  firebase-withdrawal-identity-release:
    enabled: false
  guest-merge:
    enabled: false
  phone-identity:
    fingerprint:
      enabled: false
      key-ring: ""
  phone-eligibility-binding:
    enabled: false
    consumer-scope-id: ""
    key-ring: ""
  phone-eligibility-publisher:
    enabled: false
    endpoint: ""
    audience: ""
  user-merged-publisher:
    enabled: false
    endpoint: ""
    audience: ""
  user-withdrawn-publisher:
    enabled: false
    endpoint: ""
    audience: learning-core-user-withdrawn
  user-withdrawn-backfill:
    enabled: false
    dry-run: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

sentry:
  enabled: false
  dsn: ""
  logging:
    enabled: false
  logs:
    enabled: false
