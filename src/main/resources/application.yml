spring:
  application:
    name: app-back-end-identity

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:to-teacher-identity}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8081}

app:
  consent:
    audio-policy-version: ${AUDIO_POLICY_VERSION:audio-policy-v1}
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:P14D}
    random-bytes: ${REFRESH_TOKEN_RANDOM_BYTES:32}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: ${JWT_AUDIENCE:tosunsaeng-learning-core}
    key-id: ${JWT_KEY_ID:tosunsaeng-identity-rsa-1}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:.local/keys/private.pem}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:.local/keys/public.pem}
    default-scopes:
      - learning:read
      - learning:write

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
