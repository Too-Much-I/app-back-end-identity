spring:
  application:
    name: app-back-end-identity

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:to-teacher-identity}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8081}

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}

sentry:
  enabled: ${SENTRY_ENABLED:false}
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  max-request-body-size: none
  attach-server-name: false
  send-modules: false
  traces-sample-rate: 0.0
  profiles-sample-rate: 0.0
  exception-resolver-order: 1
  logging:
    enabled: false
  logs:
    enabled: false

app:
  consent:
    privacy-version: ${PRIVACY_CONSENT_VERSION}
    term-version: ${TERM_CONSENT_VERSION}
    quality-review-version: ${QUALITY_REVIEW_CONSENT_VERSION}
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:P14D}
    random-bytes: ${REFRESH_TOKEN_RANDOM_BYTES:32}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: ${JWT_AUDIENCE:tosunsaeng-learning-core}
    key-id: ${JWT_KEY_ID:tosunsaeng-identity-rsa-1}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:.local/keys/private.pem}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:.local/keys/public.pem}
    default-scopes:
      - learning:read
      - learning:write
  firebase-auth:
    enabled: ${FIREBASE_AUTH_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    tenant-id: ${FIREBASE_TENANT_ID:}
    google-enabled: ${FIREBASE_GOOGLE_ENABLED:false}
    apple-enabled: ${FIREBASE_APPLE_ENABLED:false}
    kakao-enabled: ${FIREBASE_KAKAO_ENABLED:false}
    phone-enabled: ${FIREBASE_PHONE_ENABLED:false}
    kakao-provider-id: ${FIREBASE_KAKAO_PROVIDER_ID:oidc.kakao}
    login-max-authentication-age: ${FIREBASE_LOGIN_MAX_AUTHENTICATION_AGE:PT15M}
    high-risk-max-authentication-age: ${FIREBASE_HIGH_RISK_MAX_AUTHENTICATION_AGE:PT5M}
    clock-skew: ${FIREBASE_CLOCK_SKEW:PT30S}
    connect-timeout: ${FIREBASE_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${FIREBASE_READ_TIMEOUT:PT5S}
    enrollment-ttl: ${FIREBASE_ENROLLMENT_TTL:PT10M}
    enrollment-cleanup-retention: ${FIREBASE_ENROLLMENT_CLEANUP_RETENTION:PT24H}
  phone-identity:
    fingerprint:
      enabled: ${PHONE_IDENTITY_FINGERPRINT_ENABLED:false}
      key-ring: ${PHONE_IDENTITY_FINGERPRINT_KEY_RING:}
  phone-eligibility-binding:
    enabled: ${PHONE_ELIGIBILITY_BINDING_ENABLED:false}
    consumer-scope-id: ${PHONE_ELIGIBILITY_BINDING_CONSUMER_SCOPE_ID:}
    key-ring: ${PHONE_ELIGIBILITY_BINDING_KEY_RING:}
  phone-eligibility-publisher:
    enabled: ${PHONE_ELIGIBILITY_PUBLISHER_ENABLED:false}
    endpoint: ${PHONE_ELIGIBILITY_PUBLISHER_ENDPOINT:}
    audience: ${PHONE_ELIGIBILITY_PUBLISHER_AUDIENCE:}
    lease-duration: ${PHONE_ELIGIBILITY_PUBLISHER_LEASE_DURATION:PT60S}
    fixed-delay: ${PHONE_ELIGIBILITY_PUBLISHER_FIXED_DELAY:PT5S}
    max-attempts: ${PHONE_ELIGIBILITY_PUBLISHER_MAX_ATTEMPTS:12}
    published-retention: ${PHONE_ELIGIBILITY_PUBLISHER_PUBLISHED_RETENTION:P30D}
    dead-letter-review: ${PHONE_ELIGIBILITY_PUBLISHER_DEAD_LETTER_REVIEW:P90D}
    connect-timeout: ${PHONE_ELIGIBILITY_PUBLISHER_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${PHONE_ELIGIBILITY_PUBLISHER_READ_TIMEOUT:PT5S}
    max-batch-size: ${PHONE_ELIGIBILITY_PUBLISHER_MAX_BATCH_SIZE:20}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
