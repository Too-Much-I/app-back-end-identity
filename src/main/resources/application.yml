spring:
  application:
    name: app-back-end-identity

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:to-teacher-identity}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8081}

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}

sentry:
  enabled: ${SENTRY_ENABLED:false}
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  max-request-body-size: none
  attach-server-name: false
  send-modules: false
  traces-sample-rate: 0.0
  profiles-sample-rate: 0.0
  exception-resolver-order: 1
  logging:
    enabled: false
  logs:
    enabled: false

app:
  consent:
    privacy-version: ${PRIVACY_CONSENT_VERSION}
    term-version: ${TERM_CONSENT_VERSION}
    quality-review-version: ${QUALITY_REVIEW_CONSENT_VERSION}
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:P14D}
    random-bytes: ${REFRESH_TOKEN_RANDOM_BYTES:32}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: ${JWT_AUDIENCE:tosunsaeng-learning-core}
    key-id: ${JWT_KEY_ID:tosunsaeng-identity-rsa-1}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:.local/keys/private.pem}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:.local/keys/public.pem}
    default-scopes:
      - learning:read
      - learning:write
  jwt-rotation:
    previous-key-ids: ${JWT_PREVIOUS_KEY_IDS:}
    previous-public-key-locations: ${JWT_PREVIOUS_PUBLIC_KEY_LOCATIONS:}
  workload-jwt:
    enabled: ${WORKLOAD_JWT_ENABLED:false}
    issuer: ${WORKLOAD_JWT_ISSUER:}
    audience: ${WORKLOAD_JWT_AUDIENCE:learning-core-user-withdrawn}
    subject: ${WORKLOAD_JWT_SUBJECT:identity-service}
    ttl: ${WORKLOAD_JWT_TTL:PT2M}
  firebase-auth:
    enabled: ${FIREBASE_AUTH_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    tenant-id: ${FIREBASE_TENANT_ID:}
    google-enabled: ${FIREBASE_GOOGLE_ENABLED:false}
    apple-enabled: ${FIREBASE_APPLE_ENABLED:false}
    kakao-enabled: ${FIREBASE_KAKAO_ENABLED:false}
    phone-enabled: ${FIREBASE_PHONE_ENABLED:false}
    kakao-provider-id: ${FIREBASE_KAKAO_PROVIDER_ID:oidc.kakao}
    login-max-authentication-age: ${FIREBASE_LOGIN_MAX_AUTHENTICATION_AGE:PT15M}
    high-risk-max-authentication-age: ${FIREBASE_HIGH_RISK_MAX_AUTHENTICATION_AGE:PT5M}
    clock-skew: ${FIREBASE_CLOCK_SKEW:PT30S}
    connect-timeout: ${FIREBASE_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${FIREBASE_READ_TIMEOUT:PT5S}
    enrollment-ttl: ${FIREBASE_ENROLLMENT_TTL:PT10M}
    enrollment-cleanup-retention: ${FIREBASE_ENROLLMENT_CLEANUP_RETENTION:PT24H}
  firebase-abandoned-cleanup:
    capture-enabled: ${FIREBASE_ABANDONED_CLEANUP_CAPTURE_ENABLED:false}
    capture-dry-run: ${FIREBASE_ABANDONED_CLEANUP_CAPTURE_DRY_RUN:true}
    capture-lower-bound: ${FIREBASE_ABANDONED_CLEANUP_CAPTURE_LOWER_BOUND:}
    capture-upper-bound: ${FIREBASE_ABANDONED_CLEANUP_CAPTURE_UPPER_BOUND:}
    worker-enabled: ${FIREBASE_ABANDONED_CLEANUP_WORKER_ENABLED:false}
    grace: ${FIREBASE_ABANDONED_CLEANUP_GRACE:PT24H}
    terminal-lifecycle-retention: ${FIREBASE_ABANDONED_CLEANUP_TERMINAL_RETENTION:P7D}
    terminal-enrollment-retention: ${FIREBASE_ENROLLMENT_TERMINAL_RETENTION:PT24H}
    fixed-delay: ${FIREBASE_ABANDONED_CLEANUP_FIXED_DELAY:PT5S}
    lease-duration: ${FIREBASE_ABANDONED_CLEANUP_LEASE_DURATION:PT1M}
    max-attempts: ${FIREBASE_ABANDONED_CLEANUP_MAX_ATTEMPTS:12}
    initial-backoff: ${FIREBASE_ABANDONED_CLEANUP_INITIAL_BACKOFF:PT5S}
    max-backoff: ${FIREBASE_ABANDONED_CLEANUP_MAX_BACKOFF:PT1H}
    max-batch-size: ${FIREBASE_ABANDONED_CLEANUP_MAX_BATCH_SIZE:20}
    capture-max-batch-size: ${FIREBASE_ABANDONED_CLEANUP_CAPTURE_MAX_BATCH_SIZE:100}
  firebase-withdrawal:
    enabled: ${FIREBASE_WITHDRAWAL_ENABLED:false}
  firebase-withdrawal-cleanup:
    enabled: ${FIREBASE_WITHDRAWAL_CLEANUP_ENABLED:false}
    fixed-delay: ${FIREBASE_WITHDRAWAL_CLEANUP_FIXED_DELAY:PT5S}
    lease-duration: ${FIREBASE_WITHDRAWAL_CLEANUP_LEASE_DURATION:PT1M}
    max-attempts: ${FIREBASE_WITHDRAWAL_CLEANUP_MAX_ATTEMPTS:12}
    initial-backoff: ${FIREBASE_WITHDRAWAL_CLEANUP_INITIAL_BACKOFF:PT5S}
    max-backoff: ${FIREBASE_WITHDRAWAL_CLEANUP_MAX_BACKOFF:PT1H}
    max-batch-size: ${FIREBASE_WITHDRAWAL_CLEANUP_MAX_BATCH_SIZE:20}
    connect-timeout: ${FIREBASE_WITHDRAWAL_CLEANUP_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${FIREBASE_WITHDRAWAL_CLEANUP_READ_TIMEOUT:PT5S}
  firebase-withdrawal-identity-release:
    enabled: ${FIREBASE_WITHDRAWAL_IDENTITY_RELEASE_ENABLED:false}
    fixed-delay: ${FIREBASE_WITHDRAWAL_IDENTITY_RELEASE_FIXED_DELAY:PT5S}
    max-batch-size: ${FIREBASE_WITHDRAWAL_IDENTITY_RELEASE_MAX_BATCH_SIZE:20}
  guest-merge:
    enabled: ${GUEST_MERGE_ENABLED:false}
  phone-identity:
    fingerprint:
      enabled: ${PHONE_IDENTITY_FINGERPRINT_ENABLED:false}
      key-ring: ${PHONE_IDENTITY_FINGERPRINT_KEY_RING:}
  phone-eligibility-binding:
    enabled: ${PHONE_ELIGIBILITY_BINDING_ENABLED:false}
    consumer-scope-id: ${PHONE_ELIGIBILITY_BINDING_CONSUMER_SCOPE_ID:}
    key-ring: ${PHONE_ELIGIBILITY_BINDING_KEY_RING:}
  phone-eligibility-publisher:
    enabled: ${PHONE_ELIGIBILITY_PUBLISHER_ENABLED:false}
    base-url: ${PHONE_ELIGIBILITY_PUBLISHER_BASE_URL:}
    region: ${PHONE_ELIGIBILITY_PUBLISHER_REGION:ap-northeast-2}
    lease-duration: ${PHONE_ELIGIBILITY_PUBLISHER_LEASE_DURATION:PT60S}
    fixed-delay: ${PHONE_ELIGIBILITY_PUBLISHER_FIXED_DELAY:PT5S}
    max-attempts: ${PHONE_ELIGIBILITY_PUBLISHER_MAX_ATTEMPTS:12}
    published-retention: ${PHONE_ELIGIBILITY_PUBLISHER_PUBLISHED_RETENTION:P30D}
    dead-letter-review: ${PHONE_ELIGIBILITY_PUBLISHER_DEAD_LETTER_REVIEW:P90D}
    connect-timeout: ${PHONE_ELIGIBILITY_PUBLISHER_CONNECT_TIMEOUT:PT1S}
    read-timeout: ${PHONE_ELIGIBILITY_PUBLISHER_READ_TIMEOUT:PT3S}
    max-batch-size: ${PHONE_ELIGIBILITY_PUBLISHER_MAX_BATCH_SIZE:20}
  user-merged-publisher:
    enabled: ${USER_MERGED_PUBLISHER_ENABLED:false}
    endpoint: ${USER_MERGED_PUBLISHER_ENDPOINT:}
    audience: ${USER_MERGED_PUBLISHER_AUDIENCE:}
    lease-duration: ${USER_MERGED_PUBLISHER_LEASE_DURATION:PT60S}
    fixed-delay: ${USER_MERGED_PUBLISHER_FIXED_DELAY:PT5S}
    max-attempts: ${USER_MERGED_PUBLISHER_MAX_ATTEMPTS:12}
    published-retention: ${USER_MERGED_PUBLISHER_PUBLISHED_RETENTION:P30D}
    dead-letter-review: ${USER_MERGED_PUBLISHER_DEAD_LETTER_REVIEW:P90D}
    connect-timeout: ${USER_MERGED_PUBLISHER_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${USER_MERGED_PUBLISHER_READ_TIMEOUT:PT5S}
    max-batch-size: ${USER_MERGED_PUBLISHER_MAX_BATCH_SIZE:20}
  owner-event:
    user-merged-capture-enabled: ${OWNER_EVENT_USER_MERGED_CAPTURE_ENABLED:false}
    trial-rebind-capture-enabled: ${OWNER_EVENT_TRIAL_REBIND_CAPTURE_ENABLED:false}
    billing-user-merged-publisher-enabled: ${OWNER_EVENT_BILLING_USER_MERGED_PUBLISHER_ENABLED:false}
    learning-core-user-merged-publisher-enabled: ${OWNER_EVENT_LEARNING_CORE_USER_MERGED_PUBLISHER_ENABLED:false}
    billing-trial-rebind-publisher-enabled: ${OWNER_EVENT_BILLING_TRIAL_REBIND_PUBLISHER_ENABLED:false}
    billing-base-url: ${OWNER_EVENT_BILLING_BASE_URL:}
    billing-region: ${OWNER_EVENT_BILLING_REGION:ap-northeast-2}
    learning-core-endpoint: ${OWNER_EVENT_LEARNING_CORE_ENDPOINT:}
    learning-core-audience: ${OWNER_EVENT_LEARNING_CORE_AUDIENCE:}
    lease-duration: ${OWNER_EVENT_LEASE_DURATION:PT60S}
    fixed-delay: ${OWNER_EVENT_FIXED_DELAY:PT5S}
    initial-backoff: ${OWNER_EVENT_INITIAL_BACKOFF:PT5S}
    max-backoff: ${OWNER_EVENT_MAX_BACKOFF:PT15M}
    max-attempts: ${OWNER_EVENT_MAX_ATTEMPTS:12}
    published-retention: ${OWNER_EVENT_PUBLISHED_RETENTION:P30D}
    dead-letter-review: ${OWNER_EVENT_DEAD_LETTER_REVIEW:P90D}
    connect-timeout: ${OWNER_EVENT_CONNECT_TIMEOUT:PT1S}
    read-timeout: ${OWNER_EVENT_READ_TIMEOUT:PT3S}
    max-batch-size: ${OWNER_EVENT_MAX_BATCH_SIZE:20}
  user-withdrawn-publisher:
    enabled: ${USER_WITHDRAWN_PUBLISHER_ENABLED:false}
    endpoint: ${USER_WITHDRAWN_PUBLISHER_ENDPOINT:}
    audience: ${USER_WITHDRAWN_PUBLISHER_AUDIENCE:learning-core-user-withdrawn}
    lease-duration: ${USER_WITHDRAWN_PUBLISHER_LEASE_DURATION:PT60S}
    fixed-delay: ${USER_WITHDRAWN_PUBLISHER_FIXED_DELAY:PT5S}
    max-attempts: ${USER_WITHDRAWN_PUBLISHER_MAX_ATTEMPTS:12}
    published-retention: ${USER_WITHDRAWN_PUBLISHER_PUBLISHED_RETENTION:P30D}
    dead-letter-review: ${USER_WITHDRAWN_PUBLISHER_DEAD_LETTER_REVIEW:P90D}
    connect-timeout: ${USER_WITHDRAWN_PUBLISHER_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${USER_WITHDRAWN_PUBLISHER_READ_TIMEOUT:PT5S}
    max-batch-size: ${USER_WITHDRAWN_PUBLISHER_MAX_BATCH_SIZE:20}
  user-withdrawn-backfill:
    enabled: ${USER_WITHDRAWN_BACKFILL_ENABLED:false}
    dry-run: ${USER_WITHDRAWN_BACKFILL_DRY_RUN:true}
    lower-bound: ${USER_WITHDRAWN_BACKFILL_LOWER_BOUND:}
    upper-bound: ${USER_WITHDRAWN_BACKFILL_UPPER_BOUND:}
    batch-limit: ${USER_WITHDRAWN_BACKFILL_BATCH_LIMIT:20}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
